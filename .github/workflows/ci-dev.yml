name: CI Dev Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Archive build output
        run: zip -r build.zip dist/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
          if-no-files-found: error

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - name: Create dev GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          test -n "$TAG" || { echo "Missing dev BUILD_TAG"; exit 1; }
          test -n "$NOTE" || { echo "Missing dev RELEASE_NOTE"; exit 1; }
          test -f build.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; change BUILD_TAG for a new release."
            exit 1
          fi
          gh release create "$TAG" build.zip --title "$TAG" --notes "BUILD_TAG: $TAG

          $NOTE" --target "${GITHUB_SHA}" --prerelease
