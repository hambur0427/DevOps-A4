name: CI/CD Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Archive build output
        run: zip -r build.zip dist/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
          if-no-files-found: error

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - name: Publish staging GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          test -n "$TAG" || { echo "Missing staging BUILD_TAG"; exit 1; }
          test -n "$NOTE" || { echo "Missing staging RELEASE_NOTE"; exit 1; }
          test -f build.zip
          printf 'BUILD_TAG: %s\n\n%s\n' "$TAG" "$NOTE" > release-notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build.zip --clobber
            gh release edit "$TAG" --notes-file release-notes.txt
          else
            gh release create "$TAG" build.zip --title "$TAG" --notes-file release-notes.txt --target "$GITHUB_SHA" --prerelease
          fi

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download the same build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - name: Publish production GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          test -n "$TAG" || { echo "Missing production BUILD_TAG"; exit 1; }
          test -n "$NOTE" || { echo "Missing production RELEASE_NOTE"; exit 1; }
          test -f build.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Production release $TAG already exists; update production BUILD_TAG for the next version."
            exit 1
          fi
          printf 'BUILD_TAG: %s\n\n%s\n' "$TAG" "$NOTE" > release-notes.txt
          gh release create "$TAG" build.zip --title "$TAG" --notes-file release-notes.txt --target "$GITHUB_SHA"
